<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- ล็อกขนาดหน้าจอมือถือไม่ให้ขยายหรือเลื่อนโยกไปมา -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Clean Contour Mobile</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* ล็อกความกว้างหน้าจอ ป้องกันการเลื่อนซ้ายขวา */
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background: #f1f2f6;
      color: #2d3436;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      background: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }

    /* หัวข้อ */
    .header { text-align: center; padding-bottom: 8px; border-bottom: 1px solid #f1f2f6; }
    .header h1 { font-size: 1.15rem; color: #2d3436; }
    .header p { font-size: 0.75rem; color: #747d8c; margin-top: 2px; }

    /* ปุ่มเลือกรูป */
    #dropzone {
      border: 2px dashed #0984e3;
      background: #f0f7ff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      color: #0984e3;
    }

    /* พรีวิวภาพคู่ ซ้าย-ขวา */
    .preview-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }
    .preview-card {
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      padding: 8px;
      background: #fafafa;
      text-align: center;
    }
    .preview-title { font-size: 0.7rem; font-weight: bold; color: #747d8c; margin-bottom: 6px; }
    .preview-box {
      width: 100%;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 50% / 14px 14px;
      border-radius: 6px;
      overflow: hidden;
    }
    .preview-box img, .preview-box canvas {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    /* แผงควบคุม */
    .controls-panel {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .control-item { display: flex; flex-direction: column; gap: 4px; }
    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: #2f3542;
    }
    
    /* สไลเดอร์ปรับแต่งขนาดให้สัมผัสง่าย */
    input[type=range] {
      width: 100%;
      height: 28px;
      touch-action: pan-x; /* ป้องกันจอดิ้นเวลาลากนิ้ว */
      accent-color: #0984e3;
    }

    /* ปุ่มสลับโหมด */
    .mode-group {
      display: flex;
      gap: 10px;
      background: #e4e7eb;
      padding: 4px;
      border-radius: 8px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: transparent;
      font-size: 0.75rem;
      font-weight: 600;
      color: #57606f;
      border-radius: 6px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #ffffff;
      color: #0984e3;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* ปุ่มดาวน์โหลด */
    .btn-save {
      margin-top: auto;
      width: 100%;
      padding: 14px;
      background: #0984e3;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-save:active { background: #076fc2; transform: scale(0.99); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>Clean Contour Studio</h1>
      <p>สกัดลายเส้นคมชัดสำหรับสติกเกอร์และสมุดระบายสี</p>
    </div>

    <!-- ปุ่มเลือกรูปภาพจากมือถือ -->
    <div id="dropzone">📷 แตะที่นี่เพื่อเลือกรูปจากคลังภาพ</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <!-- พรีวิวเทียบภาพ 2 ฝั่ง -->
    <div class="preview-container">
      <div class="preview-card">
        <div class="preview-title">ต้นฉบับ</div>
        <div class="preview-box"><img id="origImg" style="display:none;"></div>
      </div>
      <div class="preview-card">
        <div class="preview-title" style="color:#0984e3;">ลายเส้นสกัด</div>
        <div class="preview-box"><canvas id="resultCanvas"></canvas></div>
      </div>
    </div>

    <!-- แผงสลับโหมดการดึงเส้น -->
    <div class="mode-group">
      <button class="mode-btn active" id="btnModeDraw" onclick="setMode('draw')">ดึงตามเส้นวาดเดิม</button>
      <button class="mode-btn" id="btnModeColor" onclick="setMode('color')">วาดล้อมรอยต่อสี</button>
    </div>

    <!-- แถบปรับสไลเดอร์ 3 ตัว (เหมือนในคลิป) -->
    <div class="controls-panel">
      <!-- 1. ความละเอียด -->
      <div class="control-item">
        <div class="control-label">
          <span>ความละเอียดดีเทล (Detail)</span>
          <span id="detailVal">65</span>
        </div>
        <input type="range" id="detail" min="20" max="95" value="65">
      </div>

      <!-- 2. ความหนาเส้น -->
      <div class="control-item">
        <div class="control-label">
          <span>ความหนาเส้น (Thickness)</span>
          <span id="thickVal">2.5</span>
        </div>
        <input type="range" id="thick" min="1.0" max="6.0" step="0.5" value="2.5">
      </div>

      <!-- 3. ลบจุดฝุ่น/Noise -->
      <div class="control-item">
        <div class="control-label">
          <span>ลบจุดฝุ่นเล็กๆ (Filter Dots)</span>
          <span id="dotsVal">3</span>
        </div>
        <input type="range" id="dots" min="0" max="8" value="3">
      </div>
    </div>

    <!-- ปุ่มบันทึกลงมือถือ -->
    <button class="btn-save" id="saveBtn">📥 บันทึกรูปลายเส้นลงเครื่อง</button>
  </div>

  <script>
    let rawImg = null;
    let currentMode = 'draw';

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const origImg = document.getElementById('origImg');
    const resultCanvas = document.getElementById('resultCanvas');
    const resultCtx = resultCanvas.getContext('2d');

    // จัดการเลือกไฟล์ภาพบนมือถือ
    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => loadFile(e.target.files[0]);

    function loadFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        rawImg = new Image();
        rawImg.onload = () => {
          origImg.src = e.target.result;
          origImg.style.display = 'block';

          // ย่อขนาดให้พอดีหน้าจอมือถือและประมวลผลเร็ว
          const maxDim = 800;
          let scale = Math.min(1, maxDim / Math.max(rawImg.width, rawImg.height));
          resultCanvas.width = Math.round(rawImg.width * scale);
          resultCanvas.height = Math.round(rawImg.height * scale);

          processContour();
        };
        rawImg.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnModeDraw').classList.toggle('active', mode === 'draw');
      document.getElementById('btnModeColor').classList.toggle('active', mode === 'color');
      processContour();
    }

    // ฟังก์ชันคำนวณลายเส้น
    function processContour() {
      if (!rawImg) return;
      const w = resultCanvas.width;
      const h = resultCanvas.height;

      const detail = parseInt(document.getElementById('detail').value);
      const thick = parseFloat(document.getElementById('thick').value);
      const dots = parseInt(document.getElementById('dots').value);

      const tempCan = document.createElement('canvas');
      tempCan.width = w;
      tempCan.height = h;
      const tCtx = tempCan.getContext('2d');

      tCtx.filter = dots > 0 ? `blur(${dots * 0.6}px)` : 'none';
      tCtx.drawImage(rawImg, 0, 0, w, h);

      const imgData = tCtx.getImageData(0, 0, w, h);
      const d = imgData.data;

      const gray = new Float32Array(w * h);
      for (let i = 0; i < d.length; i += 4) {
        gray[i / 4] = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
      }

      const edgeMap = new Uint8Array(w * h);
      const threshold = (100 - detail) * 1.5;

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          let idx = y * w + x;
          if (currentMode === 'draw') {
            let diffX = gray[idx + 1] - gray[idx - 1];
            let diffY = gray[idx + w] - gray[idx - w];
            let mag = Math.sqrt(diffX * diffX + diffY * diffY);
            if (mag > threshold && gray[idx] < 200) edgeMap[idx] = 1;
          } else {
            let i1 = ((y) * w + (x + 1)) * 4;
            let i2 = ((y) * w + (x - 1)) * 4;
            let cDiff = Math.abs(d[i1] - d[i2]) + Math.abs(d[i1+1] - d[i2+1]) + Math.abs(d[i1+2] - d[i2+2]);
            if (cDiff > threshold * 2.5) edgeMap[idx] = 1;
          }
        }
      }

      // วาดเส้นแบบ Uniform Monoline ขอบมน
      resultCtx.clearRect(0, 0, w, h);
      resultCtx.fillStyle = '#222222';
      const r = thick / 2;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (edgeMap[y * w + x] === 1) {
            resultCtx.beginPath();
            resultCtx.arc(x, y, r, 0, Math.PI * 2);
            resultCtx.fill();
          }
        }
      }
    }

    // Sliders Event
    ['detail', 'thick', 'dots'].forEach(id => {
      document.getElementById(id).addEventListener('input', (e) => {
        document.getElementById(id + 'Val').innerText = e.target.value;
        processContour();
      });
    });

    // ==========================================
    // ระบบบันทึกรูปสำหรับมือถือ (iOS & Android)
    // ==========================================
    document.getElementById('saveBtn').onclick = async () => {
      if (!rawImg) {
        alert('กรุณาเลือกรูปภาพก่อนครับ');
        return;
      }

      // สร้าง Canvas สีขาวรองหลัง (เพื่อนำไปพิมพ์/ลงสีได้สะดวก)
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = resultCanvas.width;
      exportCanvas.height = resultCanvas.height;
      const exCtx = exportCanvas.getContext('2d');
      exCtx.fillStyle = '#ffffff';
      exCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      exCtx.drawImage(resultCanvas, 0, 0);

      // ตรวจสอบว่ามือถือรองรับ Web Share API หรือไม่ (iOS/Android ส่วนใหญ่รองรับ)
      exportCanvas.toBlob(async (blob) => {
        const file = new File([blob], 'contour-lineart.png', { type: 'image/png' });
        
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'บันทึกรูปลายเส้น',
              text: 'ลายเส้นจาก Clean Contour Studio'
            });
            return;
          } catch (err) {
            // ถ้ายกเลิกการแชร์ ให้สลับไปใช้วิธีดาวน์โหลดปกติ
          }
        }

        // วิธีสำรอง: ดาวน์โหลดโดยตรง
        const a = document.createElement('a');
        a.href = exportCanvas.toDataURL('image/png');
        a.download = 'contour-lineart.png';
        a.click();
      }, 'image/png');
    };
  </script>
</body>
</html>
